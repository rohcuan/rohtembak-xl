<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RohTembak (XL)</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
<div class="login-card">
    <h1>RohTembak (XL)</h1>
    <p class="subtitle">Masuk ke dashboard</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="switch-container">
            <span id="label-user" class="active">User</span>
            <label class="switch">
                <input type="checkbox" name="role_toggle" id="role-toggle" onchange="toggleRole()">
                <span class="slider"></span>
            </label>
            <span id="label-admin">Admin</span>
        </div>
        <input type="hidden" name="role" id="role-input" value="user">

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Masukkan username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn btn-primary">Masuk</button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:#999;">
        Belum punya akun? <a href="/register">Daftar</a>
    </p>
</div>
<script>
function toggleRole() {
    const checked = document.getElementById('role-toggle').checked;
    document.getElementById('role-input').value = checked ? 'admin' : 'user';
    document.getElementById('label-user').className = checked ? '' : 'active';
    document.getElementById('label-admin').className = checked ? 'active' : '';
}
</script>
</body>
</html>
