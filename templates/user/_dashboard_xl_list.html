{% for xl in xl_accounts %}
<div class="xl-item {{ 'active' if xl.is_active }}">
    <div class="info">
        <div>
            <div class="number">{{ xl.phone_number }}</div>
            {% if xl.label %}
            <div style="font-size:12px;color:#666;">{{ xl.label }}</div>
            {% endif %}
        </div>
    </div>
    <div class="actions">
        {% if not xl.is_active %}
        <form method="POST" action="/user/xl/set-active" style="display:inline" onsubmit="return xlActivate(event, {{ xl.id }})">
            <input type="hidden" name="xl_id" value="{{ xl.id }}">
            <button class="btn btn-sm btn-outline">Aktifkan</button>
        </form>
        {% endif %}
        <form method="POST" action="/user/xl/remove" style="display:inline" onsubmit="return confirm('Hapus nomor {{ xl.phone_number }}?')">
            <input type="hidden" name="xl_id" value="{{ xl.id }}">
            <button class="btn btn-sm btn-danger">Hapus</button>
        </form>
    </div>
</div>
{% endfor %}
