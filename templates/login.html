<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RohTembak (XL)</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
<div class="login-card">
    <h1>RohTembak (XL)</h1>
    <p class="subtitle">Masuk ke dashboard</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <input type="hidden" name="role" value="{{ role or 'user' }}">
        {% if role == 'admin' %}
        <div style="text-align:center;font-size:12px;color:#4361ee;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;">Mode Admin</div>
        {% endif %}

        <div class="form-group">
            <label>Email atau Username</label>
            <input type="text" name="username" placeholder="Masukkan email atau username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn btn-primary">Masuk</button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:#999;">
        Belum punya akun? <a href="/register">Daftar</a>
    </p>
    <p style="text-align:center;margin-top:6px;font-size:13px;">
        {% if role == 'admin' %}
        <a href="/login">Masuk sebagai User</a>
        {% else %}
        <a href="/login?role=admin">Masuk sebagai Admin</a>
        {% endif %}
    </p>
</div>
</body>
</html>
