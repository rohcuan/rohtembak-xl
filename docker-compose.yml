services:
  rohtembak:
    image: debian:12
    container_name: rohtembak
    hostname: rohtembak
    ports:
      - "8000:8000"
    environment:
      APP_PORT: 8000
      INSTALL_DIR: /opt/rohtembak
    volumes:
      - rohtembak_data:/opt/rohtembak
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    restart: unless-stopped
    stop_grace_period: 30s
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]

volumes:
  rohtembak_data:
